name: Publishing the action to the marketplace

on:   
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

# Declare default GITHUB_TOKEN permissions as read only.
permissions:
  contents: read
 
jobs:
  test-local-action:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./
        name: Load used actions as a test
        with: 
          PAT: ${{ secrets.PAT }}
          user: rajbos
        id: load-actions
            
      - name: Upload result file as artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: 
          name: actions
          path: ${{ steps.load-actions.outputs.actions-file-path }}

  build:
    needs: test-local-action
    runs-on: ubuntu-latest
    steps:
      # get code
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Protect v* tags from changes
        # Tag protection requires administration permission on the PAT; the rule
        # already exists, so keep this hardening step non-blocking (missing
        # permission should not fail the release)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          gh api \
            --method PUT \
            repos/${{ github.repository }}/tags/protection \
            -f pattern='v*'
      
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      # build it
      - run: |
          npm ci
          npm run all

  release:
    name: Release with SBOM and attestations
    needs: build
    # Creates the GitHub release for this tag with the action files, a source archive and
    # SPDX/CycloneDX SBOMs attached, each with a verified artifact attestation.
    permissions:
      contents: write       # create the release and upload its assets
      id-token: write       # Sigstore keyless signing for the attestations
      attestations: write   # store the attestations
    uses: devops-actions/.github/.github/workflows/rw-release-attestation.yml@7173ecb27a93c3d22f87ff0dc735dddb189a20b3 # v1.3.0

  notify:
    needs: release
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Show release result
        env:
          RESULT: ${{ needs.release.result }}
          URL: ${{ needs.release.outputs.release-url }}
        run: echo "Release $GITHUB_REF_NAME - $RESULT $URL"

      - uses: rajbos-actions/slack@ed1309ab9862e57e9e583e51c7889486b9a00b0f # v2.0.0
        with:
          status: ${{ needs.release.result }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
